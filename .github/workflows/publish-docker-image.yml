# Builds Wheelhouse's own release bundle with its release generator, per
# wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md:
#   push              → a candidate (images tagged sha-<commit>), uploaded as the Actions artifact bundle-<commit>
#   published release → a release (changed images tagged X.Y.Z), attached as wheelhouse-release.tar.gz
#   workflow_dispatch → a candidate for one commit that has no build yet
# Unchanged services keep the previous release's images, found through its attached bundle.
name: publish-docker-image

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit SHA to build
        required: true

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: publish-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ inputs.commit || github.sha }}
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the previous release's bundle as the base
        run: |
          set -euo pipefail
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
            --jq "[.[] | select(.tagName != \"${TAG}\") | .tagName][0] // empty")
          if [ -n "$previous" ] && gh release download "$previous" -p wheelhouse-release.tar.gz -D base-archive; then
            mkdir -p base
            tar -xzf base-archive/wheelhouse-release.tar.gz -C base
            echo "BASE_ARGUMENTS=--base base" >> "$GITHUB_ENV"
          fi
      - name: Build the changed services and write the bundle
        run: |
          set -euo pipefail
          arguments=(build --checkout --commit "$COMMIT" --registry "ghcr.io/${GITHUB_REPOSITORY,,}" --output bundle)
          [ -n "$TAG" ] && arguments+=(--tag "$TAG" --archive wheelhouse-release.tar.gz)
          [ -n "$BRANCH" ] && arguments+=(--branch "$BRANCH")
          python3 engineering/codebase/wheelhouse.runner-services/release.py "${arguments[@]}" ${BASE_ARGUMENTS:-}
      - if: github.event_name == 'release'
        run: gh release upload "$TAG" wheelhouse-release.tar.gz --clobber
      - if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ inputs.commit || github.sha }}
          path: bundle/
          retention-days: 14
